models:
  - name: bridge_train_running_days 
    columns:
      - name: train_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_trains')
                field: train_key 
  - name: bridge_train_route
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: 
              - train_key 
              - station_key 
              - route_order
    columns:
      - name: train_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_trains')
                field: train_key
                
      - name: station_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_key


      