models:
  - name: fact_delay
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - train_key
              - station_key
              - date_key
    columns:
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key 

      - name: train_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_trains')
                field: train_key 

      - name: station_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_key
  - name: fact_weather
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - station_key
              - date_key
    columns:
      - name: station_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_key

      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key 

  - name: fact_fare 
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - train_key
              - class 
              - passenger_type
              - booking_type
    columns: 
      - name: train_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_trains')
                field: train_key 
      



        